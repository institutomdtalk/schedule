<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cronogramas Semanais · Instituto MD Talk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Raleway:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Burgundy conduz; o dourado vira acento raro; o papel é marfim quente. */
  --vinho:#6E1F2E; --vinho-fundo:#4A1420; --vinho-claro:#9C4257; --vinho-tenue:rgba(110,31,46,.14);
  --blush:#F7ECEA; --marfim:#FCFAF7; --areia:#F3EEE6; --pergaminho:#EFE8DC;
  --ouro:#A87F3E; --ouro-claro:#C9A467;
  --tinta:#1E1417; --tinta-suave:rgba(30,20,23,.74); --linha:rgba(30,20,23,.17);
  --ok:#3F7A55; --erro:#A8452F;
  /* cores funcionais por status */
  --st-plan:#3D6B8E;  --st-plan-bg:#E9F1F7;
  --st-curso:#B07C1E; --st-curso-bg:#FBF2DC;
  --st-feito:#3F7A55; --st-feito-bg:#E5F1E9;
  --st-remar:#7A4C8C; --st-remar-bg:#F2E9F6;
  --st-canc:#8A7C80;  --st-canc-bg:#EFEAEC;
  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'Raleway',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--marfim); color:var(--tinta); font-family:var(--sans);
  font-weight:400; -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(circle at 12% -8%,rgba(110,31,46,.10),transparent 52%),
                   radial-gradient(circle at 92% 4%,rgba(168,127,62,.09),transparent 44%),
                   radial-gradient(rgba(46,33,38,.05) 1px,transparent 1px);
  background-size:auto,auto,28px 28px;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--vinho-claro);outline-offset:2px}
::selection{background:rgba(110,31,46,.16)}

/* barras de rolagem discretas */
*{scrollbar-width:thin;scrollbar-color:rgba(110,31,46,.22) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-button{display:none;height:0;width:0}
::-webkit-scrollbar-corner{background:transparent}
::-webkit-scrollbar-thumb{background-color:rgba(110,31,46,.2);border-radius:999px;
  border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background-color:rgba(110,31,46,.42)}
aside:not(:hover){scrollbar-color:rgba(110,31,46,.1) transparent}
aside:not(:hover)::-webkit-scrollbar-thumb{background-color:rgba(110,31,46,.1)}

/* ─── ESTRUTURA ─── */
#app{display:flex;min-height:100vh;flex-direction:column;animation:surgir .5s ease}
@keyframes surgir{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

header.topo{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:22px;
  padding:16px 26px;background:rgba(252,250,247,.94);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--linha);box-shadow:0 1px 0 rgba(168,127,62,.32)}
header.topo::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--vinho-fundo),var(--vinho) 38%,var(--vinho-claro) 70%,var(--ouro))}
.topo .marca{font-family:var(--serif);font-size:12px;letter-spacing:.4em;
  color:var(--vinho);text-transform:uppercase;white-space:nowrap}
.topo .marca span{display:block;font-size:8.5px;letter-spacing:.28em;color:var(--tinta-suave);margin-top:3px}
.topo .titulo{font-family:var(--serif);font-size:21px;font-weight:400;letter-spacing:.02em;
  color:var(--tinta);border-left:1px solid var(--linha);padding-left:22px}
.topo .titulo em{font-style:italic;color:var(--vinho)}
.topo .dir{margin-left:auto;display:flex;align-items:center;gap:12px}
.conexao{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--tinta-suave);
  display:flex;align-items:center;gap:7px}
.conexao b{width:6px;height:6px;border-radius:50%;background:rgba(30,20,23,.3);display:block}
.conexao.ok b{background:var(--ok)}
.conexao.falha b{background:var(--erro)}
.menu-mob{display:none;background:none;border:none;cursor:pointer;color:var(--vinho);
  font-size:10px;letter-spacing:.2em;text-transform:uppercase}

.corpo{display:grid;grid-template-columns:272px 1fr;flex:1;min-height:0}

/* ─── LISTA DE ALUNOS ─── */
aside{border-right:1px solid var(--linha);padding:24px 0;background:var(--areia);
  position:sticky;top:68px;height:calc(100vh - 68px);overflow-y:auto}
.aside-tit{font-size:9px;letter-spacing:.32em;text-transform:uppercase;color:var(--vinho);
  padding:0 22px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.aside-tit span{font-family:var(--serif);font-size:12px;font-weight:600;letter-spacing:.04em;
  color:var(--vinho);background:var(--blush);border-radius:999px;padding:3px 11px}
.busca{margin:0 20px 18px}
.busca input{width:100%;background:#fff;border:1px solid var(--linha);
  border-radius:999px;padding:10px 16px;font-size:13px;font-weight:400;letter-spacing:.02em;
  box-shadow:0 1px 2px rgba(30,20,23,.04)}
.busca input::placeholder{color:rgba(30,20,23,.5)}
.busca input:focus{border-color:var(--vinho-claro);box-shadow:0 0 0 3px rgba(110,31,46,.1)}
.lista-alunos{list-style:none}
.lista-alunos{padding-bottom:8px}
.lista-alunos li{padding:0 12px;animation:deslizar .4s ease backwards}
@keyframes deslizar{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
.lista-alunos li button{width:100%;text-align:left;background:none;border:none;cursor:pointer;
  padding:7px 12px 7px 8px;border-radius:12px;display:flex;align-items:center;gap:12px;
  transition:background .18s,transform .18s}
.lista-alunos li button .nome{flex:1;min-width:0;font-size:13.5px;font-weight:500;
  letter-spacing:.01em;color:var(--tinta);line-height:1.35;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .18s}
.lista-alunos li button:hover{background:#fff;transform:translateX(2px);
  box-shadow:0 2px 10px rgba(30,20,23,.06)}
.lista-alunos li button:hover .nome{color:var(--vinho)}
.lista-alunos li button.ativo{background:var(--blush);box-shadow:0 3px 14px rgba(110,31,46,.14)}
.lista-alunos li button.ativo .nome{color:var(--vinho);font-weight:700}

.inicial{flex:0 0 32px;height:32px;border-radius:11px;display:grid;place-items:center;
  font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  box-shadow:inset 0 0 0 1px rgba(30,20,23,.05);transition:transform .22s,box-shadow .22s}
.lista-alunos li button:hover .inicial{transform:scale(1.06)}
.inicial[data-c="0"]{background:#DCE9F4;color:#2F5A79}
.inicial[data-c="1"]{background:#DCEDE2;color:#316346}
.inicial[data-c="2"]{background:#F6E7C6;color:#8F6316}
.inicial[data-c="3"]{background:#EADDF1;color:#653C77}
.inicial[data-c="4"]{background:#F6DCDE;color:#8A2436}
.inicial[data-c="5"]{background:#D9EAE8;color:#2C6160}
.lista-alunos li button.ativo .inicial{background:var(--vinho);color:#fff;
  box-shadow:0 3px 10px rgba(110,31,46,.32)}
.aside-vazio{padding:18px 24px;font-size:12px;color:var(--tinta);line-height:1.7}

/* ─── PAINEL PRINCIPAL ─── */
main{padding:32px 36px 90px;min-width:0}
.cabecalho-aluno{margin-bottom:26px;padding-bottom:20px;border-bottom:1px solid var(--linha)}
.cabecalho-aluno .rotulo{font-size:9px;letter-spacing:.32em;text-transform:uppercase;
  color:var(--vinho);margin-bottom:10px;display:flex;align-items:center;gap:10px}
.cabecalho-aluno .rotulo::after{content:'';flex:0 0 46px;border-top:1px solid var(--ouro)}
.cabecalho-aluno h1{font-family:var(--serif);font-size:40px;font-weight:600;color:var(--tinta);
  letter-spacing:.01em;line-height:1.08}
.cabecalho-aluno .resumo{margin-top:16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.pilula{display:inline-flex;align-items:center;gap:7px;padding:6px 14px;border-radius:999px;
  font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;
  border:1px solid transparent}
.pilula b{font-family:var(--serif);font-size:15px;font-weight:600;letter-spacing:0}
.pilula.reg{background:var(--blush);color:var(--vinho);border-color:rgba(110,31,46,.2)}
.pilula.fim{background:var(--st-feito-bg);color:var(--st-feito);border-color:rgba(63,122,85,.24)}
.pilula.abrir{background:var(--st-plan-bg);color:var(--st-plan);border-color:rgba(61,107,142,.22)}
.medidor{flex:1 1 160px;min-width:120px;height:6px;border-radius:999px;
  background:rgba(30,20,23,.09);overflow:hidden}
.medidor span{display:block;height:100%;border-radius:999px;width:0;
  background:linear-gradient(90deg,var(--vinho),var(--vinho-claro) 55%,var(--ouro));
  transition:width .6s cubic-bezier(.22,.9,.3,1)}

.barra{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:26px}
.btn{background:#fff;border:1px solid var(--vinho-tenue);color:var(--vinho);cursor:pointer;
  padding:10px 20px;font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;
  border-radius:999px;transition:.22s cubic-bezier(.22,.9,.3,1)}
.btn:hover{background:var(--blush);border-color:var(--vinho-claro);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.cheio{background:var(--vinho);color:#fff;border-color:var(--vinho);font-weight:500;
  box-shadow:0 2px 10px rgba(110,31,46,.2)}
.btn.cheio:hover{background:var(--vinho-fundo);border-color:var(--vinho-fundo);
  box-shadow:0 6px 18px rgba(110,31,46,.3)}
.btn.discreto{background:#fff;border-color:var(--linha);color:var(--tinta-suave)}
.btn.discreto:hover{border-color:var(--vinho-claro);color:var(--vinho);background:#fff}
.barra select{background:#fff;border:1px solid var(--linha);color:var(--tinta);
  border-radius:999px;padding:10px 16px;font-size:11px;letter-spacing:.1em}

/* ─── SEMANAS ─── */
.grupo-tit{display:flex;align-items:center;gap:16px;margin:40px 0 18px}
.grupo-tit h2{font-family:var(--serif);font-size:15px;font-weight:500;letter-spacing:.24em;
  text-transform:uppercase;color:var(--vinho);white-space:nowrap}
.grupo-tit hr{flex:1;border:none;border-top:1px solid var(--vinho-tenue)}

/* fluxo contínuo: um trilho vertical costura as semanas */
#semanasFuturas,#semanasAnteriores{position:relative}
#semanasFuturas::before,#semanasAnteriores::before{content:'';position:absolute;
  left:30px;top:20px;bottom:20px;width:2px;border-radius:2px;
  background:linear-gradient(180deg,transparent,var(--st-plan) 6%,var(--vinho-claro) 46%,
    var(--ouro) 78%,transparent);opacity:.3}
#semanasAnteriores{opacity:.88}

.semana{position:relative;transition:background .35s;
  animation:emergir .5s cubic-bezier(.22,.9,.3,1) backwards}
@keyframes emergir{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.semana.gravado{animation:pulsoGravado 1.2s ease}
@keyframes pulsoGravado{0%{background-color:rgba(63,122,85,.18)}
  100%{background-color:transparent}}

/* a data ganha a cor do status da semana */
.semana[data-st="Planejada"] .marco b{color:var(--st-plan)}
.semana[data-st="Em curso"] .marco b{color:var(--st-curso)}
.semana[data-st="Concluída"] .marco b{color:var(--st-feito)}
.semana[data-st="Remarcada"] .marco b{color:var(--st-remar)}
.semana[data-st="Cancelada"] .marco b{color:var(--st-canc)}
.semana[data-st] .marco i{color:currentColor;opacity:.72}
.semana::after{content:'';position:absolute;left:58px;right:8px;bottom:0;height:1px;
  background:var(--linha);opacity:.65;transition:opacity .3s}
.semana:last-child::after{display:none}
.semana.aberta{border-radius:16px;
  background:linear-gradient(100deg,rgba(247,236,234,.72),rgba(247,236,234,.12) 72%,transparent)}
.semana.aberta::after{opacity:0}


.semana-cab{width:100%;display:grid;grid-template-columns:74px 1fr auto;align-items:center;
  gap:18px;padding:18px 14px 18px 0;background:none;border:none;cursor:pointer;text-align:left}
.marco{justify-self:end;text-align:right;line-height:1;padding-right:28px}
.marco b{display:block;font-family:var(--serif);font-size:24px;font-weight:600;
  color:var(--tinta);transition:color .25s}
.marco i{display:block;font-style:normal;font-size:8.5px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--tinta-suave);margin-top:5px}
.semana-cab:hover .marco b{color:var(--vinho)}

.linha-sem{min-width:0;display:flex;flex-direction:column;gap:8px}
.sem-tit{font-family:var(--serif);font-size:20.5px;font-weight:600;color:var(--tinta);
  line-height:1.2;transition:color .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sem-tit.vazia{font-weight:400;font-style:italic;font-size:18px;color:var(--tinta-suave)}
.semana-cab:hover .sem-tit{color:var(--vinho)}
.sem-sub{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:9px;
  letter-spacing:.2em;text-transform:uppercase;color:var(--tinta-suave)}
.sem-sub .agora{font-size:8px;letter-spacing:.18em;padding:4px 11px;border-radius:999px;
  background:var(--vinho);color:#fff}

.sem-meta{display:flex;align-items:center;gap:14px}
.sem-estado{font-size:9px;letter-spacing:.16em;min-width:60px;text-align:right}
.sem-estado.salvando{color:var(--ouro)}
.sem-estado.salvo{color:var(--ok);animation:aparecer .35s ease}
@keyframes aparecer{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.sem-estado.erro{color:var(--erro)}
.chev{width:8px;height:8px;border-right:1.5px solid var(--vinho);border-bottom:1.5px solid var(--vinho);
  transform:rotate(45deg);transition:transform .35s;flex-shrink:0;opacity:.75}
.semana-cab:hover .chev{opacity:1;transform:rotate(45deg) translate(1.5px,1.5px)}
.semana.aberta .chev{transform:rotate(-135deg)}
.semana.aberta .semana-cab:hover .chev{transform:rotate(-135deg) translate(1.5px,1.5px)}

.semana-corpo{display:grid;grid-template-rows:0fr;opacity:0;
  transition:grid-template-rows .44s cubic-bezier(.22,.9,.3,1),opacity .3s ease}
.semana.aberta .semana-corpo{grid-template-rows:1fr;opacity:1}
.corpo-interno{overflow:hidden;padding:0 18px 0 92px}
.semana.aberta .corpo-interno{padding:2px 18px 26px 92px}

.entrada{padding:14px 0 4px}
.campos-rotulo{font-size:8.5px;letter-spacing:.26em;text-transform:uppercase;
  color:var(--vinho);margin-bottom:9px}
.campos{display:grid;grid-template-columns:150px 1fr 160px;gap:11px}
.campos .larga{grid-column:1/-1}
.campos input,.campos select,.campos textarea{width:100%;background:#fff;
  border:1px solid var(--linha);border-radius:10px;padding:11px 13px;color:var(--tinta);
  font-size:13px;font-weight:400;letter-spacing:.015em;transition:.18s}
.campos textarea{resize:vertical;min-height:64px;line-height:1.7}
.campos input::placeholder,.campos textarea::placeholder{color:rgba(30,20,23,.45)}
.campos input:hover,.campos textarea:hover,.campos select:hover{border-color:rgba(110,31,46,.3)}
.campos input:focus,.campos textarea:focus,.campos select:focus{
  border-color:var(--vinho-claro);box-shadow:0 0 0 4px rgba(110,31,46,.11);background:#fff}
.campos input[type=date]{color-scheme:light}
.entrada[data-status="Cancelada"]{opacity:.55}

.chip{font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;padding:5px 11px;
  border-radius:999px;border:1px solid transparent;white-space:nowrap;font-weight:600;
  color:var(--st-plan);background:var(--st-plan-bg);border-color:rgba(61,107,142,.24)}
.chip[data-s="Em curso"]{color:var(--st-curso);background:var(--st-curso-bg);
  border-color:rgba(176,124,30,.3);animation:respirar 2.8s ease-in-out infinite}
@keyframes respirar{0%,100%{box-shadow:0 0 0 0 rgba(176,124,30,.3)}
  50%{box-shadow:0 0 0 6px rgba(176,124,30,0)}}
.chip[data-s="Concluída"]{color:#fff;background:var(--st-feito);border-color:var(--st-feito)}
.chip[data-s="Remarcada"]{color:var(--st-remar);background:var(--st-remar-bg);
  border-color:rgba(122,76,140,.28)}
.chip[data-s="Cancelada"]{color:var(--st-canc);background:var(--st-canc-bg);
  border-color:rgba(138,124,128,.3);text-decoration:line-through}

.acoes-semana{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px;padding-top:18px;
  border-top:1px solid var(--vinho-tenue)}
.acoes-semana .dir{margin-left:auto}

.vazio-geral{text-align:center;padding:90px 20px;color:var(--tinta-suave)}
.vazio-geral p{font-family:var(--serif);font-size:24px;font-style:italic;color:var(--vinho);margin-bottom:12px}
.esqueleto{height:66px;border-radius:14px;margin-bottom:12px;border:1px solid var(--linha);
  background:linear-gradient(100deg,#fff 30%,var(--blush) 50%,#fff 70%);
  background-size:220% 100%;animation:brilho 1.4s ease-in-out infinite backwards}
@keyframes brilho{from{background-position:180% 0}to{background-position:-40% 0}}
.vazio-geral a{color:var(--vinho);font-weight:600}
.vazio-geral small{font-size:12.5px;color:var(--tinta);letter-spacing:.05em;line-height:1.8;display:block;max-width:430px;margin:0 auto}

#aviso{position:fixed;bottom:26px;left:50%;transform:translate(-50%,80px);z-index:60;
  background:var(--vinho);border:1px solid var(--vinho);border-radius:999px;color:#fff;
  box-shadow:0 10px 34px rgba(46,33,38,.22);
  padding:13px 24px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  transition:transform .35s,opacity .35s;opacity:0}
#aviso.on{transform:translate(-50%,0);opacity:1}
#aviso.falha{background:var(--erro);border-color:var(--erro)}

@media(max-width:900px){
  .corpo{grid-template-columns:1fr}
  aside{position:fixed;inset:68px 0 0 0;height:auto;z-index:35;background:var(--areia);
    display:none;border-right:none}
  aside.on{display:block}
  .menu-mob{display:block}
  .topo .titulo{display:none}
  main{padding:24px 18px 80px}
  .cabecalho-aluno h1{font-size:30px}
  .campos{grid-template-columns:1fr}
  .semana-cab{grid-template-columns:52px 1fr auto;gap:12px;padding:16px 6px 16px 0}
  .marco{padding-right:16px}
  .marco b{font-size:19px}
  .sem-tit{font-size:16.5px}
  .corpo-interno,.semana.aberta .corpo-interno{padding-left:64px;padding-right:8px}
  #semanasFuturas::before,#semanasAnteriores::before{left:21px}
  .semana::before{left:16px;top:23px}
  .semana::after{left:44px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{
  body{background:#fff;background-image:none}
  aside,.barra,.topo .dir,.acoes-semana,#aviso{display:none!important}
  .semana{box-shadow:none;break-inside:avoid;background:#fff}
  .semana-corpo{display:block!important}
  .campos input,.campos textarea,.campos select{border:none;box-shadow:none}
}
</style>
</head>
<body>

<!-- ══════ APLICAÇÃO ══════ -->
<div id="app">
  <header class="topo">
    <button class="menu-mob" id="menuMob">Alunos</button>
    <div class="marca">MD Talk<span>The Engine Lab</span></div>
    <div class="titulo">Cronogramas <em>semanais</em></div>
    <div class="dir">
      <div class="conexao" id="conexao"><b></b><span>Conectando</span></div>
      <button class="btn discreto" id="btnRecarregar">Recarregar</button>
    </div>
  </header>

  <div class="corpo">
    <aside id="aside">
      <div class="aside-tit">Alunos<span id="contaAlunos"></span></div>
      <div class="busca"><input type="text" id="busca" placeholder="Buscar aluno" autocomplete="off"></div>
      <ul class="lista-alunos" id="listaAlunos"></ul>
      <div class="aside-vazio" id="asideVazio" hidden></div>
    </aside>

    <main id="painel">
      <div class="vazio-geral" id="vazioGeral">
        <p>Selecione um aluno</p>
        <small>Cada aluno tem um cronograma próprio, com um registro por semana, sempre datado na segunda-feira. As semanas anteriores ficam recolhidas ao final da página.</small>
      </div>
      <div id="conteudo" hidden>
        <div class="cabecalho-aluno">
          <div class="rotulo">Registro pedagógico</div>
          <h1 id="nomeAluno"></h1>
          <div class="resumo" id="resumoAluno"></div>
        </div>
        <div class="barra">
          <select id="horizonte">
            <option value="10">10 semanas à frente</option>
            <option value="16">16 semanas à frente</option>
            <option value="24">24 semanas à frente</option>
          </select>
          <button class="btn discreto" id="btnExpandir">Abrir todas</button>
          <button class="btn discreto" id="btnRecolher">Recolher todas</button>
          <button class="btn discreto" id="btnImprimir">Imprimir</button>
        </div>
        <div id="semanasFuturas"></div>
        <div class="grupo-tit" id="tituloAnteriores" hidden>
          <h2>Semanas anteriores</h2><hr>
          <button class="btn discreto" id="btnMaisAnteriores">Carregar mais</button>
        </div>
        <div id="semanasAnteriores"></div>
      </div>
    </main>
  </div>
</div>

<div id="aviso"></div>

<script>
/* ═══════════════ CONFIGURAÇÃO ═══════════════ */

// Cole aqui a URL do app da web publicado pelo Apps Script (termina em /exec)
const API = 'https://script.google.com/macros/s/AKfycbzGbMTW1FuhGf4ZJM85lEy6QrbctiRS6hYb36_nwidksb6h5Fqxj5CWma4zefbBERfPaw/exec';

const STATUS = ['Planejada','Em curso','Concluída','Remarcada','Cancelada'];
const ENTRADAS_POR_SEMANA = 1;   // um registro por semana, na segunda-feira
const SEMANAS_ANTERIORES_INICIAL = 6;

/* ═══════════════ ESTADO ═══════════════ */

const estado = {
  alunos: [],
  aluno: null,
  dados: {},              // { '2026-S33': [ {slot,data,foco,atividade,status,obs} ] }
  abertas: new Set(),
  horizonte: 10,
  anteriores: SEMANAS_ANTERIORES_INICIAL,
  timers: {}
};

/* ═══════════════ SEMANAS (utilitários) ═══════════════ */

const MESES = ['janeiro','fevereiro','março','abril','maio','junho',
               'julho','agosto','setembro','outubro','novembro','dezembro'];

function segundaDe(d){
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
  return x;
}
function somarDias(d, n){
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  x.setDate(x.getDate() + n);
  return x;
}
function chaveSemana(d){
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  t.setUTCDate(t.getUTCDate() - ((t.getUTCDay() + 6) % 7) + 3);
  const quinta = new Date(Date.UTC(t.getUTCFullYear(), 0, 4));
  quinta.setUTCDate(quinta.getUTCDate() - ((quinta.getUTCDay() + 6) % 7) + 3);
  const n = 1 + Math.round((t - quinta) / 604800000);
  return t.getUTCFullYear() + '-S' + String(n).padStart(2, '0');
}
function iso(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function rotuloSemana(seg){
  return 'Segunda, ' + seg.getDate() + ' de ' + MESES[seg.getMonth()];
}

function resumoSemana(chave, art){
  art = art || document.querySelector('.semana[data-sem="' + chave + '"]');
  const numero = art ? art.dataset.num : chave.split('-S')[1];
  const ehAtual = art ? art.dataset.atual === '1' : false;
  const en = (estado.dados[chave] || [])[0] || {};
  const texto = String(en.foco || '').trim() || String(en.atividade || '').trim();
  const status = en.status || 'Planejada';
  if (art) { if (texto) art.dataset.st = status; else delete art.dataset.st; }

  const titulo = texto
    ? '<span class="sem-tit">' + escapar(texto.length > 80 ? texto.slice(0, 80) + '…' : texto) + '</span>'
    : '<span class="sem-tit vazia">Sem registro</span>';

  const detalhe = '<span class="sem-sub">' +
    (ehAtual ? '<span class="agora">esta semana</span>' : '') +
    '<span>Semana ' + numero + '</span>' +
    (texto ? '<span class="chip" data-s="' + escapar(status) + '">' + escapar(status) + '</span>' : '') +
    '</span>';

  return titulo + detalhe;
}

/* ═══════════════ COMUNICAÇÃO COM A PLANILHA ═══════════════ */

function chamarGet(parametros){
  return new Promise(function(resolve, reject){
    if (!API || API.indexOf('COLE_AQUI') === 0){
      reject(new Error('URL do Apps Script não configurada no arquivo.'));
      return;
    }
    const cb = 'mdt_' + Math.random().toString(36).slice(2);
    const partes = Object.keys(parametros).map(function(k){
      return encodeURIComponent(k) + '=' + encodeURIComponent(parametros[k]);
    });
    partes.push('callback=' + cb);
    const script = document.createElement('script');
    const limite = setTimeout(function(){ limpar(); reject(new Error('Tempo esgotado.')); }, 25000);
    function limpar(){ clearTimeout(limite); delete window[cb]; script.remove(); }
    window[cb] = function(resposta){
      limpar();
      if (resposta && resposta.ok) resolve(resposta);
      else reject(new Error((resposta && resposta.erro) || 'Resposta inválida.'));
    };
    script.onerror = function(){ limpar(); reject(new Error('Falha de rede.')); };
    script.src = API + '?' + partes.join('&');
    document.body.appendChild(script);
  });
}

function chamarPost(corpo){
  return fetch(API, {
    method: 'POST',
    headers: {'Content-Type': 'text/plain;charset=utf-8'},
    body: JSON.stringify(corpo)
  }).then(function(r){ return r.json(); }).then(function(resposta){
    if (!resposta.ok) throw new Error(resposta.erro || 'Falha ao gravar.');
    return resposta;
  }).catch(function(){
    // se o POST for bloqueado pelo navegador, grava pela via alternativa
    return chamarGet({action:'salvarSemana', dados: JSON.stringify(corpo)});
  });
}

function marcarConexao(classe, texto){
  const el = document.getElementById('conexao');
  el.className = 'conexao ' + classe;
  el.querySelector('span').textContent = texto;
}

function avisar(texto, falha){
  const el = document.getElementById('aviso');
  el.textContent = texto;
  el.className = 'on' + (falha ? ' falha' : '');
  clearTimeout(el._t);
  el._t = setTimeout(function(){ el.className = ''; }, 3200);
}

/* ═══════════════ CARGA ═══════════════ */

function iniciar(){
  carregarAlunos();
  document.getElementById('btnRecarregar').onclick = function(){
    carregarAlunos();
    if (estado.aluno) carregarCronograma(estado.aluno);
  };
  document.getElementById('busca').oninput = renderizarLista;
  document.getElementById('menuMob').onclick = function(){
    document.getElementById('aside').classList.toggle('on');
  };
  document.getElementById('horizonte').onchange = function(){
    estado.horizonte = Number(this.value);
    renderizarSemanas();
  };
  document.getElementById('btnExpandir').onclick = function(){
    document.querySelectorAll('#semanasFuturas .semana').forEach(function(el){
      if (!el.classList.contains('aberta')) alternarSemana(el);
    });
  };
  document.getElementById('btnRecolher').onclick = function(){
    document.querySelectorAll('.semana.aberta').forEach(function(el){
      el.classList.remove('aberta'); estado.abertas.delete(el.dataset.sem);
    });
  };
  document.getElementById('btnImprimir').onclick = function(){ window.print(); };
  document.getElementById('btnMaisAnteriores').onclick = function(){
    estado.anteriores += 8;
    renderizarSemanas();
  };
}

function carregarAlunos(){
  marcarConexao('', 'Carregando');
  chamarGet({action:'alunos'}).then(function(r){
    estado.alunos = r.alunos || [];
    marcarConexao('ok', 'Planilha conectada');
    renderizarLista();
    if (!estado.alunos.length){
      const v = document.getElementById('asideVazio');
      v.hidden = false;
      v.textContent = 'Nenhum aluno encontrado na aba configurada da planilha.';
    }
  }).catch(function(e){
    marcarConexao('falha', 'Sem conexão');
    const v = document.getElementById('asideVazio');
    v.hidden = false;
    v.textContent = e.message;
    mostrarFalha(e.message);
  });
}

function mostrarFalha(mensagem){
  const alvo = document.getElementById('vazioGeral');
  alvo.hidden = false;
  document.getElementById('conteudo').hidden = true;
  alvo.innerHTML =
    '<p>A planilha não respondeu</p>' +
    '<small><b>' + escapar(mensagem) + '</b><br><br>' +
    'Verifique, no editor do Apps Script, se a implantação está como <b>App da Web</b> ' +
    'com acesso para <b>qualquer pessoa</b> — e não para “qualquer pessoa com conta do Google”. ' +
    'Depois de alterar o código, é preciso criar uma <b>nova implantação</b>: salvar sozinho não publica a versão. ' +
    'Para conferir, abra a URL abaixo numa janela anônima; ela deve devolver um texto começando com <b>{"ok":true</b>.' +
    '</small>' +
    '<small style="margin-top:18px"><a href="' + API + '?action=ping" target="_blank" rel="noopener">Testar a conexão em outra aba</a></small>';
}

function iniciais(nome){
  const partes = String(nome).trim().split(/\s+/).filter(function(p){ return p.length > 2; });
  const primeira = partes[0] || nome;
  const ultima = partes.length > 1 ? partes[partes.length - 1] : '';
  return (primeira.charAt(0) + ultima.charAt(0)).toUpperCase();
}

function corDoNome(nome){
  let soma = 0;
  for (let i = 0; i < nome.length; i++) soma += nome.charCodeAt(i);
  return soma % 6;
}

function renderizarLista(){
  const termo = document.getElementById('busca').value.trim().toLowerCase();
  const ul = document.getElementById('listaAlunos');
  ul.innerHTML = '';
  const visiveis = estado.alunos.filter(function(n){
    return !termo || n.toLowerCase().indexOf(termo) > -1;
  });
  const conta = document.getElementById('contaAlunos');
  if (conta) conta.textContent = visiveis.length || '';
  visiveis
    .forEach(function(nome, indice){
      const li = document.createElement('li');
      li.style.animationDelay = (indice * 28) + 'ms';
      const b = document.createElement('button');
      const ini = document.createElement('span');
      ini.className = 'inicial';
      ini.dataset.c = String(corDoNome(nome));
      ini.textContent = iniciais(nome);
      const rotulo = document.createElement('span');
      rotulo.className = 'nome';
      rotulo.textContent = nome;
      rotulo.title = nome;
      b.appendChild(ini);
      b.appendChild(rotulo);
      if (nome === estado.aluno) b.className = 'ativo';
      b.onclick = function(){
        estado.aluno = nome;
        document.getElementById('aside').classList.remove('on');
        renderizarLista();
        carregarCronograma(nome);
      };
      li.appendChild(b);
      ul.appendChild(li);
    });
}

function mostrarEsqueleto(){
  const futuras = document.getElementById('semanasFuturas');
  document.getElementById('semanasAnteriores').innerHTML = '';
  document.getElementById('tituloAnteriores').hidden = true;
  futuras.innerHTML = '';
  for (let i = 0; i < 5; i++){
    const bloco = document.createElement('div');
    bloco.className = 'esqueleto';
    bloco.style.animationDelay = (i * 110) + 'ms';
    futuras.appendChild(bloco);
  }
}

function carregarCronograma(aluno){
  document.getElementById('vazioGeral').hidden = true;
  document.getElementById('conteudo').hidden = false;
  document.getElementById('nomeAluno').textContent = aluno;
  document.getElementById('resumoAluno').innerHTML = '<span>Carregando cronograma</span>';
  mostrarEsqueleto();
  estado.dados = {};
  estado.abertas = new Set();
  estado.anteriores = SEMANAS_ANTERIORES_INICIAL;

  chamarGet({action:'cronograma', aluno:aluno}).then(function(r){
    if (estado.aluno !== aluno) return;
    (r.entradas || []).forEach(function(en){
      if (!estado.dados[en.semana]) estado.dados[en.semana] = [];
      estado.dados[en.semana].push(en);
    });
    marcarConexao('ok', 'Planilha conectada');
    renderizarSemanas();
  }).catch(function(e){
    marcarConexao('falha', 'Sem conexão');
    renderizarSemanas();          // a grade aparece mesmo sem os dados
    avisar('Sem conexão com a planilha: ' + e.message, true);
  });
}

/* ═══════════════ RENDERIZAÇÃO DAS SEMANAS ═══════════════ */

function entradasDa(chave, seg){
  if (!estado.dados[chave]){
    estado.dados[chave] = [];
  }
  const linhas = [];
  for (let i = 0; i < ENTRADAS_POR_SEMANA; i++){
    const achada = estado.dados[chave].find(function(e){ return Number(e.slot) === i+1; });
    linhas.push(achada || {
      slot: i+1, data: iso(somarDias(seg, i)),
      foco: '', atividade: '', status: 'Planejada', obs: ''
    });
  }
  estado.dados[chave] = linhas;
  return linhas;
}

function contarSemana(chave){
  const linhas = estado.dados[chave] || [];
  let preenchidas = 0, concluidas = 0;
  linhas.forEach(function(e){
    if ((e.foco || '').trim() || (e.atividade || '').trim()) preenchidas++;
    if (e.status === 'Concluída') concluidas++;
  });
  return {preenchidas: preenchidas, concluidas: concluidas};
}

function renderizarSemanas(){
  const hoje = new Date();
  const segAtual = segundaDe(hoje);
  const futuras = document.getElementById('semanasFuturas');
  const anteriores = document.getElementById('semanasAnteriores');
  futuras.innerHTML = '';
  anteriores.innerHTML = '';

  for (let i = 0; i < estado.horizonte; i++){
    const seg = somarDias(segAtual, i * 7);
    const cartao = criarSemana(seg, i === 0);
    cartao.style.animationDelay = Math.min(i * 34, 400) + 'ms';
    futuras.appendChild(cartao);
  }
  for (let i = 1; i <= estado.anteriores; i++){
    const seg = somarDias(segAtual, -i * 7);
    const cartao = criarSemana(seg, false);
    cartao.style.animationDelay = Math.min(340 + i * 26, 520) + 'ms';
    anteriores.appendChild(cartao);
  }
  document.getElementById('tituloAnteriores').hidden = false;

  // a semana corrente já abre pronta para uso
  const primeira = futuras.querySelector('.semana');
  if (primeira && !estado.abertas.size) alternarSemana(primeira);

  atualizarResumoAluno();
}

function atualizarResumoAluno(){
  const chaves = Object.keys(estado.dados);
  let semanas = 0, concluidas = 0;
  chaves.forEach(function(k){
    const c = contarSemana(k);
    if (c.preenchidas) semanas++;
    concluidas += c.concluidas;
  });
  // quantas das semanas visíveis à frente já têm registro
  const segAtual = segundaDe(new Date());
  let previstas = 0;
  for (let i = 0; i < estado.horizonte; i++){
    if (contarSemana(chaveSemana(somarDias(segAtual, i * 7))).preenchidas) previstas++;
  }
  const proporcao = Math.round((previstas / estado.horizonte) * 100);

  document.getElementById('resumoAluno').innerHTML =
    '<span class="pilula reg"><b>' + semanas + '</b>' +
      (semanas === 1 ? 'semana registrada' : 'semanas registradas') + '</span>' +
    '<span class="pilula fim"><b>' + concluidas + '</b>' +
      (concluidas === 1 ? 'concluída' : 'concluídas') + '</span>' +
    '<span class="pilula abrir"><b>' + previstas + '/' + estado.horizonte + '</b>à frente</span>' +
    '<span class="medidor" title="' + proporcao + '% do horizonte planejado">' +
      '<span style="width:' + proporcao + '%"></span></span>';
}

function criarSemana(seg, ehAtual){
  const chave = chaveSemana(seg);
  const numero = chave.split('-S')[1];
  entradasDa(chave, seg);

  const art = document.createElement('article');
  art.className = 'semana' + (ehAtual ? ' atual' : '');
  art.dataset.sem = chave;
  art.dataset.seg = iso(seg);
  art.dataset.num = numero;
  art.dataset.atual = ehAtual ? '1' : '0';

  const cab = document.createElement('button');
  cab.className = 'semana-cab';
  cab.title = rotuloSemana(seg);
  cab.innerHTML =
    '<span class="marco"><b>' + seg.getDate() + '</b><i>' + MESES[seg.getMonth()].slice(0, 3) + '</i></span>' +
    '<span class="linha-sem">' + resumoSemana(chave, art) + '</span>' +
    '<span class="sem-meta">' +
      '<span class="sem-estado"></span>' +
      '<span class="chev"></span>' +
    '</span>';
  cab.onclick = function(){ alternarSemana(art); };
  art.appendChild(cab);

  const corpo = document.createElement('div');
  corpo.className = 'semana-corpo';
  art.appendChild(corpo);

  if (estado.abertas.has(chave)){
    art.classList.add('aberta');
    montarCorpo(art);
  }
  return art;
}

function alternarSemana(art){
  const chave = art.dataset.sem;
  if (art.classList.contains('aberta')){
    art.classList.remove('aberta');
    estado.abertas.delete(chave);
    return;
  }
  estado.abertas.add(chave);
  if (!art.querySelector('.entrada')) montarCorpo(art);
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){ art.classList.add('aberta'); });
  });
}

function montarCorpo(art){
  const chave = art.dataset.sem;
  const seg = new Date(art.dataset.seg + 'T00:00:00');
  const linhas = entradasDa(chave, seg);
  const corpo = art.querySelector('.semana-corpo');
  corpo.innerHTML = '';
  const interno = document.createElement('div');
  interno.className = 'corpo-interno';
  corpo.appendChild(interno);

  linhas.forEach(function(linha, i){
    const div = document.createElement('div');
    div.className = 'entrada';
    div.dataset.status = linha.status;
    div.innerHTML =
      '<div class="campos-rotulo">Programação da semana</div>' +
      '<div class="campos">' +
        '<input type="date" data-c="data" value="' + (linha.data || '') + '">' +
        '<input type="text" data-c="foco" placeholder="Foco da aula ou estrutura" value="' + escapar(linha.foco) + '">' +
        '<select data-c="status">' + STATUS.map(function(s){
          return '<option' + (s === linha.status ? ' selected' : '') + '>' + s + '</option>';
        }).join('') + '</select>' +
        '<textarea class="larga" data-c="atividade" placeholder="Conteúdo, material e tarefa da semana">' + escapar(linha.atividade) + '</textarea>' +
        '<input class="larga" type="text" data-c="obs" placeholder="Observações" value="' + escapar(linha.obs) + '">' +
      '</div>';
    div.querySelectorAll('[data-c]').forEach(function(campo){
      campo.addEventListener('input', function(){
        linha[campo.dataset.c] = campo.value;
        if (campo.dataset.c === 'status') div.dataset.status = campo.value;
        atualizarContagem(art);
        agendarGravacao(art);
      });
    });
    interno.appendChild(div);
  });

  const acoes = document.createElement('div');
  acoes.className = 'acoes-semana';
  acoes.innerHTML =
    '<button class="btn discreto" data-a="copiar">Repetir semana anterior</button>' +
    '<button class="btn discreto" data-a="limpar">Limpar semana</button>' +
    '<button class="btn cheio dir" data-a="salvar">Salvar semana</button>';
  acoes.querySelector('[data-a="copiar"]').onclick = function(){ copiarAnterior(art); };
  acoes.querySelector('[data-a="limpar"]').onclick = function(){ limparSemana(art); };
  acoes.querySelector('[data-a="salvar"]').onclick = function(){ gravar(art); };
  interno.appendChild(acoes);
}

function escapar(t){
  return String(t || '').replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function atualizarContagem(art){
  const el = art.querySelector('.linha-sem');
  if (el) el.innerHTML = resumoSemana(art.dataset.sem, art);
  atualizarResumoAluno();
}

function copiarAnterior(art){
  const seg = new Date(art.dataset.seg + 'T00:00:00');
  const anterior = chaveSemana(somarDias(seg, -7));
  const origem = estado.dados[anterior];
  if (!origem || !contarSemana(anterior).preenchidas){
    avisar('A semana anterior está vazia', true);
    return;
  }
  const destino = estado.dados[art.dataset.sem];
  origem.forEach(function(en, i){
    destino[i].foco = en.foco;
    destino[i].atividade = en.atividade;
    destino[i].obs = en.obs;
    destino[i].status = 'Planejada';
  });
  montarCorpo(art);
  atualizarContagem(art);
  gravar(art);
}

function limparSemana(art){
  if (!confirm('Apagar o registro desta semana?')) return;
  const seg = new Date(art.dataset.seg + 'T00:00:00');
  estado.dados[art.dataset.sem] = null;
  entradasDa(art.dataset.sem, seg);
  montarCorpo(art);
  atualizarContagem(art);
  gravar(art);
}

/* ═══════════════ GRAVAÇÃO ═══════════════ */

function agendarGravacao(art){
  const chave = art.dataset.sem;
  estadoSemana(art, 'salvando', 'Editando');
  clearTimeout(estado.timers[chave]);
  estado.timers[chave] = setTimeout(function(){ gravar(art); }, 2000);
}

function estadoSemana(art, classe, texto){
  const el = art.querySelector('.sem-estado');
  if (el){ el.className = 'sem-estado ' + classe; el.textContent = texto; }
}

function gravar(art){
  const chave = art.dataset.sem;
  clearTimeout(estado.timers[chave]);
  estado.timers[chave] = null;
  const aluno = estado.aluno;
  if (!aluno) return;
  estadoSemana(art, 'salvando', 'Salvando');
  chamarPost({
    action: 'salvarSemana',
    aluno: aluno,
    semana: chave,
    entradas: estado.dados[chave] || []
  }).then(function(){
    estadoSemana(art, 'salvo', 'Salvo');
    art.classList.remove('gravado');
    void art.offsetWidth;
    art.classList.add('gravado');
    setTimeout(function(){ art.classList.remove('gravado'); }, 1200);
    setTimeout(function(){ estadoSemana(art, '', ''); }, 2500);
  }).catch(function(e){
    estadoSemana(art, 'erro', 'Erro');
    avisar('Não foi possível salvar: ' + e.message, true);
  });
}

document.addEventListener('keydown', function(ev){
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 's'){
    ev.preventDefault();
    const ativa = document.activeElement.closest('.semana');
    if (ativa) gravar(ativa);
    else document.querySelectorAll('.semana.aberta').forEach(gravar);
  }
});

iniciar();

window.addEventListener('beforeunload', function(ev){
  const pendente = Object.keys(estado.timers).some(function(k){ return estado.timers[k]; });
  if (pendente){ ev.preventDefault(); ev.returnValue = ''; }
});
